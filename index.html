<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotbollskjuts</title>
<style>
  body { font-family: Arial, sans-serif; margin:20px; background:#f0f0f0; }
  h1,h2,h3 { margin:5px 0; }
  input[type=text], input[type=date], select { padding:5px; }
  button { padding:3px 6px; margin:2px; cursor:pointer; }
  .training { border-radius:6px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
  .training-header { display:flex; justify-content:space-between; align-items:center; font-weight:bold; margin-bottom:5px; }
  .sections { display:flex; gap:20px; margin-top:10px; }
  .section h3 { margin:5px 0; }
  table { width:100%; border-collapse:collapse; margin-bottom:5px; }
  th,td { padding:3px; border:1px solid #ccc; text-align:left; }
  th { background:#ddd; }
  .label-green { background:#e6ffe6; }
  .label-red { background:#ffe6e6; }
  #app { display:none; }
  #login { margin-bottom:20px; }
</style>
</head>
<body>

<h1>Fotbollskjuts</h1>

<div id="login">
  <label>Namn: <input type="text" id="username"></label>
  <button onclick="login()">Logga in</button>
</div>

<div id="app">
  <h3 id="loggedInParent">Du är inloggad som: </h3>
  <h2>Lägg till träning</h2>
  <label>Datum: <input type="date" id="date"></label>
  <label>Start: <select id="startTime"></select></label>
  <label>Slut: <select id="endTime"></select></label>
  <label>Plats: <input type="text" id="place" placeholder="Plats"></label>
  <button onclick="addTraining()">➕ Lägg till träning</button>
  <button onclick="removePastTrainings()">Ta bort passerade träningar</button>
  <button onclick="reloadTrainings()">🔄 Uppdatera</button>

  <h2>Träningar</h2>
  <div id="trainings"></div>
</div>

<script src="app.js" defer></script>
<script>
// Generera tid-val med timme+15 min intervall
function generateTimeOptions() {
  const startSel = document.getElementById("startTime");
  const endSel = document.getElementById("endTime");
  const times = [];
  for(let h=0; h<24; h++){
    [0,15,30,45].forEach(m=>{
      let hh = h.toString().padStart(2,'0');
      let mm = m.toString().padStart(2,'0');
      times.push(`${hh}:${mm}`);
    });
  }
  if(startSel) startSel.innerHTML = times.map(t=>`<option value="${t}">${t}</option>`).join('');
  if(endSel) endSel.innerHTML = times.map(t=>`<option value="${t}">${t}</option>`).join('');
}
generateTimeOptions();
</script>

</body>
</html>
