<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotbollsträningar</title>
<style>
body { font-family: Arial, sans-serif; margin:10px; background:#f9f9f9; }
h2,h3 { margin:5px 0; }
input, select, button { margin:2px 0; }
button { cursor:pointer; }
#app { display:none; }
.sections { display:flex; gap:20px; overflow-x:auto; }
.section { flex:1; min-width:250px; }
table { width:100%; border-collapse:collapse; margin-top:5px; }
table th, table td { border:1px solid #ccc; padding:4px; font-size:14px; text-align:center; }
table th { background:#eee; font-weight:bold; border-bottom:2px solid #aaa; }
input[type="text"] { width:100%; font-weight:bold; }
.training { border:1px solid #aaa; border-radius:5px; margin-bottom:10px; padding:10px; }
.training-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; font-weight:bold; }

tr.success td { background:#e6ffe6; }
tr.warning td { background:#ffe6e6; }

@media (max-width: 768px) {
  .sections { flex-direction: column; }
  .section { width:100% !important; }
  table { font-size:13px; }
  table th, table td { padding:6px; }
  button { padding:6px 8px; font-size:14px; }
  .training-header { font-size:16px; }
  h3 { font-size:16px; margin-bottom:5px; }
}
.copy-dialog, #editModal {
  background:#fff; border:1px solid #aaa; padding:10px; position:fixed; top:20%; left:5%; width:90%; z-index:1000; border-radius:8px;
}
</style>
</head>
<body>
<div id="login">
<h2>Logga in</h2>
<input type="text" id="username" placeholder="Ditt namn">
<button onclick="login()">Logga in</button>
</div>

<div id="app">
<h3 id="loggedInParent">Du är inloggad som: </h3>
<h2>Lägg till träning</h2>
<label>Datum: <input type="date" id="date"></label>
<label>Start: <select id="startTime"></select></label>
<label>Slut: <select id="endTime"></select></label>
<label>Plats: <input type="text" id="place" placeholder="Plats"></label>
<button onclick="addTraining()">➕ Lägg till träning</button>
<button onclick="removePastTrainings()">Ta bort passerade träningar</button>
<button onclick="reloadTrainings()">🔄 Uppdatera</button>

<h2>Träningar</h2>
<div id="trainings"></div>
</div>

<!-- Modal för edit träning -->
<div id="editModal" style="display:none;">
<h3>Editera träning</h3>
<label>Datum: <input type="date" id="editDate"></label><br>
<label>Start: <select id="editStart"></select></label><br>
<label>Slut: <select id="editEnd"></select></label><br>
<label>Plats: <input type="text" id="editPlace"></label><br>
<button id="saveEditBtn">Spara</button>
<button onclick="closeEditModal()">Avbryt</button>
</div>

<script src="app.js"></script>
<script>
// Initiera tidslistor för add och edit
const startSel = document.getElementById("startTime");
const endSel = document.getElementById("endTime");
const editStart = document.getElementById("editStart");
const editEnd = document.getElementById("editEnd");
for(let h=6;h<=22;h++){
  for(let m=0;m<60;m+=15){
    const val = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
    startSel.innerHTML += `<option value="${val}">${val}</option>`;
    endSel.innerHTML += `<option value="${val}">${val}</option>`;
    editStart.innerHTML += `<option value="${val}">${val}</option>`;
    editEnd.innerHTML += `<option value="${val}">${val}</option>`;
  }
}
</script>
</body>
</html>
